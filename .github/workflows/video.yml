name: Make video (Gemini Veo)

# The site's "סרטונים" page: the Worker starts this run with a job id, and
# everything heavy happens here — asking Veo, waiting minutes, downloading,
# scrambling. What's left is one scrambled file (the same format as the
# pictures, see desktop/images.py) as a short-lived artifact; the Worker
# passes it on to the desktop app and deletes it.
#
# Nothing private is in the inputs or the log (the repository is public):
# the prompt and the Gemini keys are read from the Worker with AGENT_TOKEN.
# Repository secrets: TRACKER_URL (https://<worker>/yt), AGENT_TOKEN.
run-name: video
on:
  workflow_dispatch:
    inputs:
      job:
        description: "job id (from the site)"
        required: true

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRACKER_URL: ${{ secrets.TRACKER_URL }}
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - run: pip install --quiet cryptography

      - name: Make the video
        run: python3 .github/scripts/make_video.py

      - id: up
        uses: actions/upload-artifact@v4
        with:
          name: vid-${{ inputs.job }}
          path: out/v.yti
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Tell the site
        if: always()
        env:
          UPLOAD: ${{ steps.up.outcome }}
        run: python3 .github/scripts/make_video.py report
