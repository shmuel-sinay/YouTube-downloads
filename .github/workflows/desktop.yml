name: Build desktop app (Windows)

# Builds desktop/app.py into YTTracker.exe on a Windows machine and publishes
# it as the "desktop-latest" release, so there's always one fixed link to the
# newest version. This only *builds* the app — no downloading happens here.
on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      - name: Stamp version (the app compares it with the latest release to self-update)
        shell: bash
        run: echo "$GITHUB_SHA" > desktop/version.txt

      - name: Build YTTracker.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name YTTracker
          --icon desktop/icon.ico --add-data "desktop/icon.ico;."
          --add-data "desktop/version.txt;."
          --collect-all imageio_ffmpeg --collect-all webview --hidden-import pystray._win32 --hidden-import vault --hidden-import vault_ui --hidden-import netfree --exclude-module tkinter --paths desktop
          desktop/app.py

      - name: Zip it too (some filters block .exe downloads)
        shell: pwsh
        run: Compress-Archive -Path dist/YTTracker.exe -DestinationPath dist/YTTracker.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YTTracker
          path: dist/YTTracker.exe

      - name: Publish as release "desktop-latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="הורד את YTTracker.exe (או YTTracker.zip אם ה-exe נחסם) ופתח בלחיצה כפולה. נבנה מ-${GITHUB_SHA::7}."
          gh release delete desktop-latest --yes --cleanup-tag || true
          # Deleting is not instant on GitHub's side — retry creating.
          for i in 1 2 3 4 5 6; do
            if gh release create desktop-latest dist/YTTracker.exe dist/YTTracker.zip \
                 --target "$GITHUB_SHA" --title "תוכנה למחשב — גרסה אחרונה" --notes "$NOTES"; then
              exit 0
            fi
            sleep 10
          done
          # Last resort: update the existing release in place (the app reads
          # target_commitish to decide whether to self-update).
          gh release upload desktop-latest dist/YTTracker.exe dist/YTTracker.zip --clobber
          gh release edit desktop-latest --target "$GITHUB_SHA" --notes "$NOTES"
